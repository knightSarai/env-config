# Install the vault-encrypted key from ./.ssh into ~/.ssh.
# `copy` decrypts vault files transparently, so the playbook needs --ask-vault-pass
# (bootstrap.sh handles this). Runs as the user; no root involved.
- name: Ensure ~/.ssh exists
  ansible.builtin.file:
    path: "{{ dest_key | dirname }}"
    state: directory
    mode: "0700"

- name: Install private key
  ansible.builtin.copy:
    src: "{{ source_key }}"
    dest: "{{ dest_key }}"
    mode: "0600"
    decrypt: true

- name: Install public key
  ansible.builtin.copy:
    src: "{{ source_key }}.pub"
    dest: "{{ dest_key }}.pub"
    mode: "0644"
    decrypt: true

- name: Authorize own public key
  ansible.posix.authorized_key:
    user: "{{ user }}"
    state: present
    key: "{{ lookup('file', dest_key + '.pub') }}"
